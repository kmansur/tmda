name: Python 3 source compatibility

on:
  push:
    branches:
      - feature/python3-migration
  pull_request:

jobs:
  source-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q TMDA bin
      - name: Compile extensionless entry points
        run: python -m py_compile bin/tmda-address bin/tmda-check-address bin/tmda-filter bin/tmda-inject bin/tmda-keygen bin/tmda-ofmipd bin/tmda-pending bin/tmda-rfilter bin/tmda-sendmail
