name: Python 3 isolated install smoke test

on:
  push:
    branches:
      - feature/python3-migration
  pull_request:

jobs:
  venv-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create an isolated virtual environment
        run: python -m venv .tmda-test-venv
      - name: Build and install the local development package
        run: |
          .tmda-test-venv/bin/python -m pip install --upgrade pip
          .tmda-test-venv/bin/python -m pip install .
      - name: Check installed package outside the source tree
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.tmda-test-venv/bin/python" -c "import TMDA, TMDA.SMTPEventLoop; print(TMDA.__file__)"
          "$GITHUB_WORKSPACE/.tmda-test-venv/bin/tmda-address" -V
          "$GITHUB_WORKSPACE/.tmda-test-venv/bin/tmda-keygen" -V
          "$GITHUB_WORKSPACE/.tmda-test-venv/bin/tmda-ofmipd" --help > /dev/null
      - name: Verify original TMDA response templates are installed
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.tmda-test-venv/bin/python" -c 'import sys, pathlib; d = pathlib.Path(sys.prefix) / "share" / "tmda"; expected = {"confirm_request.txt", "confirm_accept.txt", "bounce_invalid_confirmation.txt", "bounce_missing_pending.txt", "bounce_incoming.txt", "bounce_expired_dated.txt", "bounce_fail_dated.txt", "bounce_fail_keyword.txt", "bounce_fail_sender.txt"}; found = {p.name for p in d.glob("*.txt")}; assert found == expected, (d, found); print("Original TMDA templates:", len(found))'
