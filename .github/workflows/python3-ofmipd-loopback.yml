name: Python 3 SMTP loopback integration tests

on:
  push:
    branches:
      - feature/python3-migration
  pull_request:

jobs:
  smtp-loopback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated SMTP protocol integration tests
        run: python -m unittest discover -s integration -p 'test_*.py' -v
